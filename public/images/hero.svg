<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#heroBg)"/>
  <!-- Gold Frame Portal -->
  <circle cx="400" cy="380" r="240" fill="none" stroke="#fde047" stroke-width="6" filter="url(#goldGlow)"/>
  <circle cx="400" cy="380" r="220" fill="#1e1b4b"/>
  <!-- Romantic couple illustration inside -->
  <path d="M 400 240 Q 450 180 500 240 Q 550 300 400 400 Q 250 300 300 240 Q 350 180 400 240 Z" fill="#ec4899" filter="url(#goldGlow)"/>
  <circle cx="350" cy="320" r="35" fill="#fbcfe8"/>
  <circle cx="450" cy="320" r="30" fill="#f472b6"/>
  <path d="M 300 440 C 300 360, 500 360, 500 440 Z" fill="#9d174d"/>
  <!-- Stars & sparkles around portal -->
  <circle cx="150" cy="180" r="4" fill="#fde047"/>
  <circle cx="650" cy="180" r="5" fill="#fde047"/>
  <circle cx="120" cy="550" r="3" fill="#fff"/>
  <circle cx="680" cy="550" r="4" fill="#fff"/>
  <text x="400" y="680" fill="#fde047" font-family="serif" font-size="32" text-anchor="middle" font-weight="bold">Happy Birthday, Zulfa ❤️</text>
</svg>
