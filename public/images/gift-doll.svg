<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dollBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="pinkGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#dollBg)"/>
  <!-- Teddy Bear Body -->
  <circle cx="300" cy="360" r="110" fill="#d97706" filter="url(#pinkGlow)"/>
  <circle cx="300" cy="360" r="85" fill="#f59e0b"/>
  <!-- Teddy Bear Head -->
  <circle cx="300" cy="220" r="90" fill="#d97706"/>
  <circle cx="300" cy="220" r="75" fill="#f59e0b"/>
  <!-- Ears -->
  <circle cx="220" cy="150" r="35" fill="#d97706"/>
  <circle cx="220" cy="150" r="22" fill="#fef3c7"/>
  <circle cx="380" cy="150" r="35" fill="#d97706"/>
  <circle cx="380" cy="150" r="22" fill="#fef3c7"/>
  <!-- Snout & Nose -->
  <ellipse cx="300" cy="235" rx="32" ry="24" fill="#fef3c7"/>
  <ellipse cx="300" cy="225" rx="14" ry="10" fill="#78350f"/>
  <!-- Eyes -->
  <circle cx="265" cy="205" r="10" fill="#451a03"/>
  <circle cx="262" cy="202" r="3" fill="#fff"/>
  <circle cx="335" cy="205" r="10" fill="#451a03"/>
  <circle cx="332" cy="202" r="3" fill="#fff"/>
  <!-- Red Bow Ribbon with Heart -->
  <path d="M 260 290 Q 300 310 340 290 Q 350 320 300 310 Q 250 320 260 290 Z" fill="#f43f5e"/>
  <path d="M 300 295 Q 310 280 320 295 Q 330 310 300 330 Q 270 310 280 295 Q 290 280 300 295 Z" fill="#fb7185"/>
  <text x="300" y="520" fill="#ffe4e6" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold">Boneka Peluk 🧸</text>
</svg>
