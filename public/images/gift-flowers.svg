<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="flowerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#flowerBg)"/>
  <!-- Bouquet Wrapping Paper -->
  <polygon points="200,480 400,480 450,280 150,280" fill="#fbcfe8" opacity="0.9"/>
  <polygon points="220,480 380,480 420,320 180,320" fill="#f472b6"/>
  <!-- Ribbon -->
  <rect x="250" y="380" width="100" height="16" fill="#fde047" rx="4"/>
  <!-- Roses Cluster -->
  <g transform="translate(300,210)">
    <circle cx="0" cy="0" r="45" fill="#f43f5e"/>
    <circle cx="-50" cy="20" r="40" fill="#fb7185"/>
    <circle cx="50" cy="20" r="40" fill="#fb7185"/>
    <circle cx="-25" cy="-40" r="38" fill="#e11d48"/>
    <circle cx="25" cy="-40" r="38" fill="#e11d48"/>
    <circle cx="0" cy="0" r="25" fill="#fda4af"/>
  </g>
  <!-- Sparkles -->
  <circle cx="140" cy="180" r="4" fill="#fde047"/>
  <circle cx="460" cy="180" r="5" fill="#fde047"/>
  <text x="300" y="540" fill="#fde047" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold">Buket Bunga Romantis 💐</text>
</svg>
