<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="mysteryBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#mysteryBg)"/>
  <!-- Mysterious Glowing Gift Box -->
  <rect x="200" y="260" width="200" height="180" rx="16" fill="#7e22ce" stroke="#fde047" stroke-width="4" filter="url(#goldGlow)"/>
  <rect x="180" y="220" width="240" height="50" rx="10" fill="#a855f7" stroke="#fde047" stroke-width="4"/>
  <!-- Gold Ribbon -->
  <rect x="285" y="220" width="30" height="220" fill="#fde047"/>
  <!-- Glowing Question Mark / Lock Emblem -->
  <circle cx="300" cy="350" r="35" fill="#fde047" filter="url(#goldGlow)"/>
  <text x="300" y="363" fill="#581c87" font-family="sans-serif" font-size="36" font-weight="900" text-anchor="middle">?</text>
  <!-- Floating Question Marks & Sparkles -->
  <text x="160" y="180" fill="#fde047" font-family="sans-serif" font-size="28" font-weight="bold">❓</text>
  <text x="420" y="180" fill="#fde047" font-family="sans-serif" font-size="28" font-weight="bold">✨</text>
  <text x="300" y="520" fill="#fde047" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold">Hadiah Paling Misterius 🎁❓</text>
</svg>
