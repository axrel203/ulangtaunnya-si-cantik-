<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg1)"/>
  <circle cx="150" cy="120" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="450" cy="90" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="500" cy="220" r="2" fill="#fff" opacity="0.6"/>
  <!-- Phone Screen Frame -->
  <rect x="180" y="100" width="240" height="400" rx="30" fill="#1e1b4b" stroke="#ec4899" stroke-width="4" filter="url(#glow1)"/>
  <rect x="195" y="125" width="210" height="350" rx="15" fill="#090d16"/>
  <!-- Couple avatar call graphics -->
  <circle cx="300" cy="220" r="50" fill="#f472b6" opacity="0.3"/>
  <path d="M 300 190 A 25 25 0 0 1 300 240 A 25 25 0 0 1 300 190 M 260 270 C 260 250, 340 250, 340 270 Z" fill="#fb7185"/>
  <path d="M 300 330 Q 310 320 320 330 T 340 330 Q 350 345 330 360 L 300 390 L 270 360 Q 250 345 260 330 T 280 330 Q 290 320 300 330 Z" fill="#ec4899" filter="url(#glow1)"/>
  <text x="300" y="440" fill="#fbcfe8" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Video Call ❤️ Zulfa</text>
</svg>
